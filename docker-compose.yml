version: '3.8'

services:
  # Main application service
  portfolio-app:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Database connection
      - DATABASE_URL=postgresql://portfolio_user:secure_password@portfolio-db:5432/portfolio_db
      - PGHOST=portfolio-db
      - PGPORT=5432
      - PGUSER=portfolio_user
      - PGPASSWORD=secure_password
      - PGDATABASE=portfolio_db
      
      # Application settings
      - NODE_ENV=production
      - SESSION_SECRET=your-very-secure-session-secret-change-this
      - PORT=5000
      
      # For self-hosting without Replit Auth, you can implement alternative auth
      - REPLIT_DOMAINS=localhost:5000
      - REPL_ID=self-hosted-portfolio
    
    depends_on:
      portfolio-db:
        condition: service_healthy
    
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    # Wait for database to be ready
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        while ! pg_isready -h portfolio-db -p 5432 -U portfolio_user; do
          sleep 1
        done &&
        echo 'Database is ready!' &&
        npm run db:push &&
        npm start
      "

  # PostgreSQL database service
  portfolio-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=portfolio_db
      - POSTGRES_USER=portfolio_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    
    volumes:
      - portfolio_db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    
    ports:
      - "5432:5432"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Nginx reverse proxy for production
  portfolio-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - portfolio-app
    restart: unless-stopped
    profiles:
      - production

volumes:
  portfolio_db_data:
    driver: local

networks:
  default:
    driver: bridge